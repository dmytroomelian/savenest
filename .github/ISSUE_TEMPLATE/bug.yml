name: Bug report
description: Report an unexpected behavior using non-sensitive examples.
labels: ["bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug. Use sample data and remove personal URLs, notes, email addresses, and tokens.
        Report vulnerabilities privately through [SECURITY.md](https://github.com/dmytro-omelian/savenest/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Savenest and macOS versions
      placeholder: "Savenest 0.11.0, macOS 14.7 (or a source commit)"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac processor
      options:
        - Apple Silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: app_mode
    attributes:
      label: How are you running Savenest?
      options:
        - Downloaded app
        - Source preview (npm run preview)
        - Source app (npm start)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Include the browser and version if this involves capture, tabs, or history.
      value: |
        Steps to reproduce:
        1.

        Expected behavior:

        Actual behavior:
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant checks or screenshots
      description: Include relevant errors, checks you ran, or screenshots with sample data. Do not attach a real library or browser database.
