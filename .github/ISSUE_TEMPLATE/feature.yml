name: Feature request
description: Describe a workflow and the problem you need to solve.
labels: ["enhancement", "status:triage"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Describe the workflow you want to improve; a feature request does not guarantee implementation.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the current workflow, the obstacle, and who encounters it.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What would a useful result look like?
      description: Include alternatives you have tried. A specific implementation is optional.
