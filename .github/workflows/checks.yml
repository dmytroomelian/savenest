name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: swift run --disable-get-task-allow-entitlement SaveNestChecks
      - run: npm test
      - run: npm run build:native
